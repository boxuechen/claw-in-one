[package]
name = "claw-in-one-supervisor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22.1"
fs2 = "0.4.3"
getrandom = "0.2.17"
hex = "0.4.3"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10.9"
signal-hook = "0.3.18"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
