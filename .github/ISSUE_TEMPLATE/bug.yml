name: Bug report
description: Report a reproducible ClawInOne problem without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, setup codes, tokens, or unredacted logs. Report security issues privately through SECURITY.md.
  - type: input
    id: build
    attributes:
      label: App commit or version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add screenshots or sanitized diagnostics if useful.
